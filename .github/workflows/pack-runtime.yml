name: Studio backend and Pack contracts
on:
  pull_request:
    paths: ['engine/**', 'protocol/**', '.github/workflows/pack-runtime.yml']
  push:
    branches: ['main', 'feature/studio/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: docker pull postgres:18.4
      - run: ./build.sh verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: engine/**/target/surefire-reports/
