services:
  copilot-postgres:
    image: ${IMAGE_POSTGRES:-pgvector/pgvector:pg17}
    container_name: dts-copilot-postgres
    environment:
      POSTGRES_DB: ${PG_DB:-copilot}
      POSTGRES_USER: ${PG_USER:-copilot}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-copilot_dev}
    ports:
      - "${PG_HOST_PORT:-55432}:5432"
    volumes:
      - copilot-pg-data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-copilot} -d ${PG_DB:-copilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  copilot-ollama:
    image: ${IMAGE_OLLAMA:-ollama/ollama:0.18.0}
    container_name: dts-copilot-ollama
    profiles: ["ollama"]
    ports:
      - "${OLLAMA_PORT:-51434}:11434"
    volumes:
      - copilot-ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "if command -v curl >/dev/null 2>&1; then curl -fsS http://localhost:11434/api/tags >/dev/null; else wget -q -O /dev/null http://localhost:11434/api/tags; fi || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  copilot-ai:
    image: ${IMAGE_COPILOT_AI:-dts-copilot-ai:latest}
    build:
      context: ./dts-copilot-ai
      dockerfile: Dockerfile
      args:
        IMAGE_JRE: ${IMAGE_JRE:-eclipse-temurin:21-jre-alpine}
    container_name: dts-copilot-ai
    environment:
      PG_HOST: copilot-postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB:-copilot}
      PG_USER: ${PG_USER:-copilot}
      PG_PASSWORD: ${PG_PASSWORD:-copilot_dev}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_API_KEY: ${LLM_API_KEY:-}
      COPILOT_ADMIN_SECRET: ${COPILOT_ADMIN_SECRET:-change-me-in-production}
      COPILOT_ACTION_ADMINAPI_BASE_URL: ${COPILOT_ACTION_ADMINAPI_BASE_URL:-}
      COPILOT_ACTION_ADMINAPI_AUTHORIZATION: ${COPILOT_ACTION_ADMINAPI_AUTHORIZATION:-}
      DTS_PLATFORM_BASE_URL: ${DTS_PLATFORM_BASE_URL:-}
      DTS_PLATFORM_TOKEN_URL: ${DTS_PLATFORM_TOKEN_URL:-}
      DTS_PLATFORM_CLIENT_ID: ${DTS_PLATFORM_CLIENT_ID:-}
      DTS_PLATFORM_CLIENT_SECRET: ${DTS_PLATFORM_CLIENT_SECRET:-}
      DTS_PLATFORM_AUTH_TOKEN: ${DTS_PLATFORM_AUTH_TOKEN:-}
      DTS_PLATFORM_SERVICE_NAME: ${DTS_PLATFORM_SERVICE_NAME:-dts-copilot}
      DTS_PLATFORM_SERVICE_TOKEN: ${DTS_PLATFORM_SERVICE_TOKEN:-${DTS_INBOUND_FROM_COPILOT:-${DTS_INBOUND_FROM_ANALYTICS:-${DTS_ADMIN_SERVICE_TOKEN:-}}}}
      DTS_PLATFORM_TIMEOUT_SECONDS: ${DTS_PLATFORM_TIMEOUT_SECONDS:-10}
      PLATFORM_INDICATOR_SYNC_ENABLED: ${PLATFORM_INDICATOR_SYNC_ENABLED:-true}
      PLATFORM_INDICATOR_SYNC_INTERVAL: ${PLATFORM_INDICATOR_SYNC_INTERVAL:-3600000}
      PLATFORM_INDICATOR_SYNC_INITIAL_DELAY: ${PLATFORM_INDICATOR_SYNC_INITIAL_DELAY:-15000}
      PLATFORM_INDICATOR_SYNC_PAGE_SIZE: ${PLATFORM_INDICATOR_SYNC_PAGE_SIZE:-100}
      PLATFORM_INDICATOR_SYNC_MAX_PAGES: ${PLATFORM_INDICATOR_SYNC_MAX_PAGES:-200}
      DTS_DBT_DB_HOST: ${DTS_DBT_DB_HOST:-host.docker.internal}
      DTS_DBT_DB_PORT: ${DTS_DBT_DB_PORT:-5432}
      DTS_DBT_DB_NAME: ${DTS_DBT_DB_NAME:-biadmin}
      DTS_DBT_DB_USER: ${DTS_DBT_DB_USER:-biadmin}
      DTS_DBT_DB_PASSWORD: ${DTS_DBT_DB_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default: null
      dts-core: null
    ports:
      - "${COPILOT_AI_PORT:-8091}:8091"
    depends_on:
      copilot-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "if command -v curl >/dev/null 2>&1; then curl -fsS http://localhost:8091/actuator/health >/dev/null; else wget -q -O /dev/null http://localhost:8091/actuator/health; fi || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  copilot-analytics:
    image: ${IMAGE_COPILOT_ANALYTICS:-dts-copilot-analytics:latest}
    build:
      context: ./dts-copilot-analytics
      dockerfile: Dockerfile
      args:
        IMAGE_JRE: ${IMAGE_JRE:-eclipse-temurin:21-jre-alpine}
    container_name: dts-copilot-analytics
    environment:
      PG_HOST: copilot-postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB:-copilot}
      PG_USER: ${PG_USER:-copilot}
      PG_PASSWORD: ${PG_PASSWORD:-copilot_dev}
      COPILOT_AI_BASE_URL: http://copilot-ai:8091
      COPILOT_ADMIN_SECRET: ${COPILOT_ADMIN_SECRET:-change-me-in-production}
      DTS_PLATFORM_BASE_URL: ${DTS_PLATFORM_BASE_URL:-}
      DTS_PLATFORM_TOKEN_URL: ${DTS_PLATFORM_TOKEN_URL:-}
      DTS_PLATFORM_CLIENT_ID: ${DTS_PLATFORM_CLIENT_ID:-}
      DTS_PLATFORM_CLIENT_SECRET: ${DTS_PLATFORM_CLIENT_SECRET:-}
      DTS_PLATFORM_AUTH_TOKEN: ${DTS_PLATFORM_AUTH_TOKEN:-}
      DTS_PLATFORM_SERVICE_NAME: ${DTS_PLATFORM_SERVICE_NAME:-dts-copilot}
      DTS_PLATFORM_SERVICE_TOKEN: ${DTS_PLATFORM_SERVICE_TOKEN:-${DTS_INBOUND_FROM_COPILOT:-${DTS_INBOUND_FROM_ANALYTICS:-${DTS_ADMIN_SERVICE_TOKEN:-}}}}
      DTS_PLATFORM_TIMEOUT_SECONDS: ${DTS_PLATFORM_TIMEOUT_SECONDS:-10}
      DTS_PLATFORM_VALUE_CACHE_TTL_SECONDS: ${DTS_PLATFORM_VALUE_CACHE_TTL_SECONDS:-60}
      DTS_DBT_DB_HOST: ${DTS_DBT_DB_HOST:-host.docker.internal}
      DTS_DBT_DB_PORT: ${DTS_DBT_DB_PORT:-5432}
      DTS_DBT_DB_NAME: ${DTS_DBT_DB_NAME:-biadmin}
      DTS_DBT_DB_USER: ${DTS_DBT_DB_USER:-biadmin}
      DTS_DBT_DB_PASSWORD: ${DTS_DBT_DB_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default: null
      dts-core: null
    ports:
      - "${COPILOT_ANALYTICS_PORT:-8092}:8092"
    depends_on:
      copilot-postgres:
        condition: service_healthy
      copilot-ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "if command -v curl >/dev/null 2>&1; then curl -fsS http://localhost:8092/actuator/health >/dev/null; else wget -q -O /dev/null http://localhost:8092/actuator/health; fi || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  copilot-webapp:
    image: ${IMAGE_COPILOT_WEBAPP:-dts-copilot-webapp:latest}
    build:
      context: ./dts-copilot-webapp
      dockerfile: Dockerfile
      args:
        IMAGE_NODE: ${IMAGE_NODE:-node:20-alpine}
        IMAGE_NGINX: ${IMAGE_NGINX:-nginx:alpine}
    container_name: dts-copilot-webapp
    ports:
      - "${COPILOT_WEBAPP_PORT:-50080}:80"
    depends_on:
      copilot-analytics:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "if command -v curl >/dev/null 2>&1; then curl -fsS http://localhost:80/ >/dev/null; else wget -q -O /dev/null http://localhost:80/; fi || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  copilot-proxy:
    image: ${IMAGE_TRAEFIK:-traefik:v3.5.2}
    container_name: dts-copilot-proxy
    ports:
      - "${TLS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./services/proxy/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./services/proxy/dynamic:/etc/traefik/dynamic:ro
      - ./services/certs/server.crt:/certs/server.crt:ro
      - ./services/certs/server.key:/certs/server.key:ro
    depends_on:
      copilot-ai:
        condition: service_healthy
      copilot-analytics:
        condition: service_healthy
      copilot-webapp:
        condition: service_healthy
    restart: unless-stopped

volumes:
  copilot-pg-data:
  copilot-ollama-data:

networks:
  dts-core:
    external: true
    name: ${DTS_CORE_NETWORK:-dts-core}
